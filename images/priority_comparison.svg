<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
  <title id="title">ARIA W006 positive and negative fixture priority comparison</title>
  <desc id="desc">Two synthetic W006 cases. Both begin at a neutral 0.50 priority. In the positive case goal 1 rises to 0.62 after target_found and remains selected. In the negative case goal 1 falls to 0.38 after false_probe, so goal 2 at 0.50 is selected.</desc>
  <rect width="1120" height="610" rx="20" fill="#f7f9fc"/>
  <text x="56" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#14253d">W006 fixture priority revision</text>
  <text x="56" y="91" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#506176">Scratch-native priority history on a shared 0–1 scale · synthetic outcomes only</text>

  <rect x="44" y="122" width="498" height="408" rx="16" fill="#ffffff" stroke="#d9e2ee"/>
  <rect x="578" y="122" width="498" height="408" rx="16" fill="#ffffff" stroke="#d9e2ee"/>

  <text x="76" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#155e46">Positive fixture</text>
  <text x="76" y="191" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#506176">target_found · evaluator signal +1.0</text>
  <text x="610" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#8a4d13">Negative fixture</text>
  <text x="610" y="191" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#506176">false_probe · evaluator signal −1.0</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#627187">
    <text x="178" y="224">0</text><text x="258" y="224">0.25</text><text x="338" y="224">0.50</text><text x="418" y="224">0.75</text><text x="498" y="224">1.0</text>
    <text x="712" y="224">0</text><text x="792" y="224">0.25</text><text x="872" y="224">0.50</text><text x="952" y="224">0.75</text><text x="1032" y="224">1.0</text>
  </g>
  <g stroke="#e4eaf1" stroke-width="1">
    <line x1="184" y1="232" x2="184" y2="448"/><line x1="264" y1="232" x2="264" y2="448"/><line x1="344" y1="232" x2="344" y2="448"/><line x1="424" y1="232" x2="424" y2="448"/>
    <line x1="718" y1="232" x2="718" y2="448"/><line x1="798" y1="232" x2="798" y2="448"/><line x1="878" y1="232" x2="878" y2="448"/><line x1="958" y1="232" x2="958" y2="448"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#24364d">
    <text x="76" y="270">Goal 1 before</text><text x="76" y="318">Goal 1 after</text><text x="76" y="366">Goal 2 reference</text>
    <text x="610" y="270">Goal 1 before</text><text x="610" y="318">Goal 1 after</text><text x="610" y="366">Goal 2 reference</text>
  </g>

  <rect x="184" y="250" width="160" height="25" rx="6" fill="#aab6c5"/>
  <rect x="184" y="298" width="198" height="25" rx="6" fill="#238566"/>
  <rect x="184" y="346" width="160" height="25" rx="6" fill="#d5dde7"/>
  <text x="354" y="269" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#33465d">0.50</text>
  <text x="392" y="317" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#155e46">0.62</text>
  <text x="354" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#506176">0.50</text>

  <rect x="718" y="250" width="160" height="25" rx="6" fill="#aab6c5"/>
  <rect x="718" y="298" width="122" height="25" rx="6" fill="#d27a32"/>
  <rect x="718" y="346" width="160" height="25" rx="6" fill="#3984b5"/>
  <text x="888" y="269" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#33465d">0.50</text>
  <text x="850" y="317" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#8a4d13">0.38</text>
  <text x="888" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#225b80">0.50 · selected</text>

  <rect x="76" y="405" width="430" height="74" rx="11" fill="#edf8f3"/>
  <text x="96" y="434" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#155e46">Later arbitration: Goal 1 selected</text>
  <text x="96" y="459" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#33465d">Priority revision survives component reload.</text>

  <rect x="610" y="405" width="430" height="74" rx="11" fill="#fff4e8"/>
  <text x="630" y="434" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#8a4d13">Later arbitration: Goal 2 selected</text>
  <text x="630" y="459" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#33465d">Goal 1's untrusted success claim was ignored.</text>

  <text x="56" y="566" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#506176">Data: saved W006 positive/negative fixture JSON. The graphic is a static summary, not a runtime screenshot.</text>
  <text x="56" y="588" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#506176">Synthetic fixture results; rule-based priority revision, not production learning.</text>
</svg>
